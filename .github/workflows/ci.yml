name: CI

on:
  # Any base branch, so pull requests stacked on other branches are checked too
  pull_request:
  push:
    branches: [develop]
  # Manual runs from the Actions tab or `gh workflow run ci.yml --ref <branch>`
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties is tracked with a macOS sdk.dir; the runner provides ANDROID_HOME
      - name: Remove local.properties
        run: rm -f local.properties

      - name: Assemble debug APK
        run: ./gradlew :salem-android:assembleDebug

      - name: Core JVM tests
        run: ./gradlew :salem-core:jvmTest

      - name: Android JVM unit tests
        run: ./gradlew :salem-android:testDebugUnitTest

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

  ios-compile:
    # Pinned: macos-latest is a moving label and Kotlin/Native depends on the Xcode version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties is tracked with a macOS sdk.dir of the owner's machine
      - name: Remove local.properties
        run: rm -f local.properties

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile iOS targets
        run: ./gradlew :salem-core:compileKotlinIosSimulatorArm64 :salem-core:compileKotlinIosArm64

      # Tests that need an iOS actual that is still a TODO stub are skipped (salem-core/ios-blocked-tests.txt)
      - name: Run iOS tests
        run: ./gradlew :salem-core:iosSimulatorArm64Test
