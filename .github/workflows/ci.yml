name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties is tracked with a macOS sdk.dir; the runner provides ANDROID_HOME
      - name: Remove local.properties
        run: rm -f local.properties

      - name: Assemble debug APK
        run: ./gradlew :uhabits-android:assembleDebug

      - name: Core JVM tests
        run: ./gradlew :uhabits-core:jvmTest

      - name: Android JVM unit tests
        run: ./gradlew :uhabits-android:testDebugUnitTest

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties is tracked with a macOS sdk.dir of the owner's machine
      - name: Remove local.properties
        run: rm -f local.properties

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile iOS targets
        run: ./gradlew :uhabits-core:compileKotlinIosSimulatorArm64 :uhabits-core:compileKotlinIosArm64
