name: CI

on:
  # Any base branch, so pull requests stacked on other branches are checked too
  pull_request:
  push:
    branches: [develop]
  # Manual runs from the Actions tab or `gh workflow run ci.yml --ref <branch>`
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties is tracked with a macOS sdk.dir; the runner provides ANDROID_HOME
      - name: Remove local.properties
        run: rm -f local.properties

      - name: Assemble debug APK
        run: ./gradlew :salem-android:assembleDebug

      - name: Core JVM tests
        run: ./gradlew :salem-core:jvmTest

      # The board that the iOS widget and shortcuts use, tested on the JVM over the same database code
      - name: iOS extras tests
        run: ./gradlew :salem-extras:jvmTest

      - name: iOS session tests
        run: ./gradlew :salem-kit:jvmTest

      - name: Android JVM unit tests
        run: ./gradlew :salem-android:testDebugUnitTest

      # The desktop target of salem-ui only exists to render the core charts with Skia and compare them with the core images
      - name: Shared UI tests
        run: ./gradlew :salem-ui:desktopTest :salem-ui:compileDebugKotlinAndroid

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

  ios-compile:
    # Pinned: macos-latest is a moving label and Kotlin/Native depends on the Xcode version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # local.properties is tracked with a macOS sdk.dir of the owner's machine
      - name: Remove local.properties
        run: rm -f local.properties

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile iOS targets
        run: ./gradlew :salem-core:compileKotlinIosSimulatorArm64 :salem-core:compileKotlinIosArm64

      # Tests that need an iOS actual that is still a TODO stub are skipped (salem-core/ios-blocked-tests.txt)
      - name: Run iOS tests
        run: ./gradlew :salem-core:iosSimulatorArm64Test

      - name: Compile the iOS app framework
        run: ./gradlew :salem-kit:compileKotlinIosSimulatorArm64 :salem-kit:compileKotlinIosArm64

      - name: Compile the iOS extras
        run: ./gradlew :salem-extras:compileKotlinIosSimulatorArm64 :salem-extras:compileKotlinIosArm64

      # Builds the Kotlin framework through Gradle and the app with it, for the simulator, without signing
      - name: Build the iOS app
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
